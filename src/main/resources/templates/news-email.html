<table width="650" align="center" cellpadding="0" cellspacing="0" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #333;">
    <!-- 头部 -->
    <tr>
        <td style="padding: 20px 0; border-bottom: 2px solid #1677ff;">
            <h2 style="margin:0; color: #1677ff;" th:text="${mail.brandName}">AI速递</h2>
            <p style="margin: 5px 0 0; color: #666; font-size: 14px;">
                <span th:text="${mail.dateText}">2026年09月06日 星期日</span>
                · 预计阅读<span th:text="${mail.estimatedReadMinutes}">3</span>分钟
            </p>
        </td>
    </tr>

    <!-- 今日速览 -->
    <tr>
        <td style="padding: 15px 20px; background: #f0f7ff; border-radius: 6px; margin: 15px 0;">
            <strong>今日速览：</strong><span th:text="${mail.overview}">本期新闻概览</span>
        </td>
    </tr>

    <!-- 正文新闻区 -->
    <th:block th:each="section : ${mail.sections}">
        <tr th:if="${!#lists.isEmpty(section.items)}">
            <td style="padding: 15px 0 5px;">
                <h3 style="margin:0; color: #d4380d;" th:text="${section.displayName}">🚀 重磅发布</h3>
            </td>
        </tr>
        <tr th:each="item : ${section.items}">
            <td style="padding: 10px 0 15px; border-bottom: 1px dashed #eee;">
                <a th:if="${!#strings.isEmpty(item.originalLink)}" th:href="${item.originalLink}" rel="nofollow" style="color: #1677ff; font-weight: bold; font-size: 16px; text-decoration: none;" th:text="${item.title}">新闻标题</a>
                <span th:unless="${!#strings.isEmpty(item.originalLink)}" style="color: #1677ff; font-weight: bold; font-size: 16px;" th:text="${item.title}">新闻标题</span>
                <p style="margin: 8px 0; line-height: 1.6; font-size: 14px;" th:text="${item.summary}">新闻摘要</p>
                <span style="color: #999; font-size: 12px;">来源：<span th:text="${item.sourceName}">新闻来源</span> · <span th:text="${item.publishedAtText}">发布时间</span></span>
            </td>
        </tr>
    </th:block>

    <!-- 底部 -->
    <tr>
        <td style="padding: 20px 0; border-top: 1px solid #eee; color: #999; font-size: 12px; text-align: center;">
            由 <span th:text="${mail.brandName}">AI速递</span> 每日定时推送 · 点击标题跳转原文 · 内容由 AI 整理，仅供参考
        </td>
    </tr>
</table>
