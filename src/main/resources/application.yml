spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: ai-news-helper
  ai:
    model:
      chat: dashscope
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      read-timeout: ${AI_DASHSCOPE_READ_TIMEOUT_MS:60000}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}
          temperature: 0.2
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${MAIL_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

news:
  dry-run: ${NEWS_DRY_RUN:false} #测试使用：true-不发送邮件，false-发送邮件
  schedule:
    cron: ${NEWS_SCHEDULE_CRON:0 0 8 * * *}
    zone: ${NEWS_SCHEDULE_ZONE:Asia/Shanghai}
  rss:
    window-hours: ${NEWS_WINDOW_HOURS:24}
    max-items: ${NEWS_MAX_ITEMS:15}
    max-content-chars: ${NEWS_MAX_CONTENT_CHARS:5000}
    request-timeout-seconds: ${NEWS_REQUEST_TIMEOUT_SECONDS:20}
    max-concurrent-sources: ${NEWS_MAX_CONCURRENT_SOURCES:4}
    fetch-timeout-seconds: ${NEWS_FETCH_TIMEOUT_SECONDS:60}
    max-feed-bytes: ${NEWS_MAX_FEED_BYTES:1048576}
    domestic-ratio: ${NEWS_DOMESTIC_RATIO:0.3}
    user-agent: ${NEWS_RSS_USER_AGENT:ai-news-helper/0.0.1}
    sources:
      # ============ 国内科技媒体 ============
      - id: jiqizhixin
        name: 机器之心
        url: https://www.jiqizhixin.com/rss
        format: rss
        lang: zh
        category: news
        enabled: true
        region: 国内

      - id: qbitai
        name: 量子位
        url: https://www.qbitai.com/feed
        format: rss
        lang: zh
        category: news
        enabled: true
        region: 国内

      - id: leiphone
        name: 雷峰网
        url: https://www.leiphone.com/feed
        format: rss
        lang: zh
        category: news
        enabled: true
        region: 国内

      # 【新增】国内主流综合/科技媒体（含AI频道）
      - id: 36kr
        name: 36氪
        url: https://36kr.com/feed
        format: rss
        lang: zh
        category: news
        enabled: true
        region: 国内

      - id: aiera
        name: 新智元
        url: https://www.aiera.com.cn/feed
        format: rss
        lang: zh
        category: news
        enabled: true
        region: 国内

      - id: tmtpost
        name: 钛媒体
        url: https://www.tmtpost.com/feed
        format: rss
        lang: zh
        category: news
        enabled: true
        region: 国内

      # ============ 国际科技媒体 ============
      - id: techcrunch
        name: TechCrunch AI
        url: https://techcrunch.com/category/artificial-intelligence/feed/
        format: rss
        lang: en
        category: news
        enabled: true
        region: 国际

      - id: venturebeat
        name: VentureBeat AI
        url: https://venturebeat.com/category/ai/feed/
        format: rss
        lang: en
        category: news
        enabled: true
        region: 国际

      # 【新增】全球顶尖科技评论
      - id: mit-tech-review
        name: MIT Technology Review AI
        url: https://www.technologyreview.com/feed/ai/
        format: rss
        lang: en
        category: news
        enabled: true
        region: 国际

      # ============ 厂商官方博客 ============
      - id: google-ai
        name: Google AI Blog
        url: https://blog.google/technology/ai/rss/
        format: rss
        lang: en
        category: blog
        enabled: true
        region: 国际

      - id: aws-ml
        name: AWS Machine Learning Blog
        url: https://aws.amazon.com/blogs/machine-learning/feed/
        format: rss
        lang: en
        category: blog
        enabled: true
        region: 国际

      - id: huggingface-blog
        name: Hugging Face Blog
        url: https://huggingface.co/blog/feed.xml
        format: rss
        lang: en
        category: blog
        enabled: true
        region: 国际

      # 【新增】OpenAI 和 Anthropic 官方动态
      - id: openai-news
        name: OpenAI News
        url: https://openai.com/news/rss.xml
        format: rss
        lang: en
        category: blog
        enabled: true
        region: 国际

      - id: anthropic-news
        name: Anthropic News
        url: https://www.anthropic.com/news/rss.xml
        format: rss
        lang: en
        category: blog
        enabled: true
        region: 国际

      # ============ 学术研究 ============
      - id: arxiv-ai
        name: arXiv cs.AI
        url: https://export.arxiv.org/rss/cs.AI
        format: rss
        lang: en
        category: research
        enabled: true
        region: 国际

      - id: arxiv-learning
        name: arXiv cs.LG
        url: https://export.arxiv.org/rss/cs.LG
        format: rss
        lang: en
        category: research
        enabled: true
        region: 国际

      # ============ GitHub Releases（Atom 格式） ============
      - id: vllm-releases
        name: vLLM Releases
        url: https://github.com/vllm-project/vllm/releases.atom
        format: atom
        lang: en
        category: release
        enabled: false
        region: 国际

      - id: transformers-releases
        name: Transformers Releases
        url: https://github.com/huggingface/transformers/releases.atom
        format: atom
        lang: en
        category: release
        enabled: false
        region: 国际

      # 【优化】Qwen 配置策略：保留主仓库（覆盖通用版）
      - id: qwen-releases
        name: Qwen Releases (Main)
        url: https://github.com/QwenLM/Qwen/releases.atom
        format: atom
        lang: en
        category: release
        enabled: true #是否启用：false-表示禁用，true-表示启用
        region: 国际
  ai:
    max-attempts: ${NEWS_AI_MAX_ATTEMPTS:2}
    retry-backoff-millis: ${NEWS_AI_RETRY_BACKOFF_MILLIS:500}
    system-prompt: >-
      你是一个专业、严谨的AI新闻编辑，负责将原始新闻整理成结构化的每日AI简报。
      严格遵守以下所有规则：
      1. 输出标准JSON格式，根节点包含4个数组：heavyRelease、techFrontier、industryNews、openSourceTools
      2. 所有海外新闻必须翻译成流畅中文，标题和摘要都用中文
      3. 每个板块按重要性从高到低排序，总条数控制在10-15条
      4. 禁止输出任何JSON格式以外的内容、解释、备注、markdown标记
      5. RSS原文摘要为空的，根据标题合理补充摘要，禁止出现"暂无摘要""RSS未提供"等字样
      6. 禁止引入原文之外的外部知识（包括模型训练数据中的日期、背景、人物等）
      7. 事件发生日期，若原文有明确日期则原样输出，若无则输出 "近日"
    user-prompt-template: >-
      请将以下文章内容翻译成中文并生成详细摘要，要求：
      1.所有新闻必须翻译成流畅中文，标题和正文翻译成中文;
      2. 生成3-4条详细要点，每条200字以内;
      3. 在要点中标注重要信息、数据、时间等关键信息;
      4. 如果涉及重要政策、技术突破、投资金额等，请特别标注
      5. 在判断该新闻属于哪个类型的新闻
      6. 【重要】原文如果没有明确提到具体日期（如“2026年7月10日”），请不要用你自己的知识补充任何日期。
          时间表述必须严格忠实于原文：
            - 原文写 “Today” → 输出 “今日” 或 “近日”
            - 原文写 “2026年7月10日” → 输出 “2026年7月10日”
            - 原文没有日期 → 输出中不出现任何日期
      以下是今日抓取到的原始新闻列表，请按上面的规则整理输出:
      新闻资料：
        标题:{news-title}
        正文:{news-content}
        类型:{news-type}
        发布时间:{news-publish-date}
  mail:
    enabled: ${NEWS_MAIL_ENABLED:true}
    from: ${NEWS_MAIL_FROM:} #发件人邮箱
    from-name: "AI 快讯" #自定义发件名称
    brand-name: ${NEWS_MAIL_BRAND_NAME:AI速递}
    to: ${NEWS_MAIL_TO:} #收件人邮箱
    show-original-links: ${NEWS_MAIL_SHOW_ORIGINAL_LINKS:true}
    trusted-link-domains: ${NEWS_MAIL_TRUSTED_LINK_DOMAINS:}
    subject-prefix: ${NEWS_MAIL_SUBJECT_PREFIX:AI 前沿速递}
    send-retry-attempts: ${NEWS_MAIL_SEND_RETRY_ATTEMPTS:2}
    retry-backoff-millis: ${NEWS_MAIL_RETRY_BACKOFF_MILLIS:1000}


#日志配置
logging:
  level:
    com.ai.news: DEBUG
